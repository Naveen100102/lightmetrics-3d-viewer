<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactive 3D for Websites</title><style>
*{box-sizing:border-box}body{margin:0;background:#151515;color:white;font:16px Arial,sans-serif}header,footer{display:flex;align-items:center;gap:16px;padding:16px 5%;justify-content:space-between}a{color:#e7a5de}button{font:inherit;color:white;background:transparent;border:1px solid #666;padding:10px 16px;cursor:pointer}button:hover,button:focus-visible{background:#961a86}main{max-width:1280px;margin:auto}#slide{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:white}nav{display:flex;gap:12px;align-items:center}details{max-width:1152px;margin:20px auto;padding:20px;line-height:1.6;background:#222}#notes{white-space:pre-wrap}#notes a{overflow-wrap:anywhere}h1{font-size:18px;margin:0}footer{flex-wrap:wrap}.hint{color:#bbb;font-size:13px}@media(max-width:650px){header{align-items:flex-start;flex-direction:column}footer{padding:15px}button{padding:9px}details{margin:15px}}
</style></head><body><header><h1>Interactive 3D for websites</h1><a href="Interactive-3D-for-Websites.pptx" download>Download PowerPoint</a></header><main><img id="slide" alt="Presentation slide"></main><footer><nav aria-label="Slide navigation"><button id="prev" aria-label="Previous slide">← Previous</button><span id="counter" aria-live="polite"></span><button id="next" aria-label="Next slide">Next →</button></nav><span class="hint">Use ← → keys to navigate</span><button id="full">Fullscreen</button></footer><details><summary>Speaker notes and sources</summary><div id="notes"></div></details><script>
let current=Math.max(1,Math.min(11,Number(location.hash.slice(1))||1)),data=[];const slide=document.querySelector('#slide');function show(){slide.src='slides/slide-'+String(current).padStart(2,'0')+'.png?v=short';slide.alt=data[current-1]?.title||'Slide '+current;document.querySelector('#counter').textContent=current+' / 11';history.replaceState(null,'','#'+current);const n=document.querySelector('#notes');n.replaceChildren();const d=data[current-1];if(d){n.append(document.createTextNode(d.notes+'\n\nSources\n'));for(const url of d.sources){const a=document.createElement('a');a.href=url;a.textContent=url;a.target='_blank';a.rel='noopener';n.append(a,document.createElement('br'));}}}function move(delta){current=Math.max(1,Math.min(11,current+delta));show()}document.querySelector('#prev').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});document.querySelector('#full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};fetch('content.json?v=short').then(r=>r.json()).then(d=>{data=d;show()});show();
</script></body></html>
